name: release

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub Release is published.
# No API token is stored anywhere: PyPI trusts this workflow by repo + filename + environment.
#
# The trusted publisher on PyPI is configured with NO environment, so this workflow declares none
# either (the two must match; this file's name, release.yml, must also match the PyPI config).
# If you later add an environment on PyPI's Publishing tab, add a matching `environment:` here.
#
# To cut a release: bump `version` in pyproject.toml (PyPI rejects re-uploading 0.2.1), then
# create a GitHub Release with a tag (e.g. v0.2.2). This workflow builds and publishes it.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
